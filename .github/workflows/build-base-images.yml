name: Build Linux base images

on:
  repository_dispatch:
    types: [source-mirrors-updated]
  schedule:
    - cron: '30 * * * *'
  workflow_dispatch:
    inputs:
      distribution:
        description: Distribution to build
        type: choice
        required: true
        default: all
        options: [all, Ubuntu, Debian, Centos, Alpine, Fedora, AlmaLinux, ArchLinux, RockyLinux]

permissions:
  contents: read
  packages: write

concurrency:
  group: base-images
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      SELECTED_DISTRIBUTION: ${{ inputs.distribution || github.event.client_payload.distribution || 'all' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        distribution: [Ubuntu, Debian, Centos, Alpine, Fedora, AlmaLinux, ArchLinux, RockyLinux]
    steps:
      - name: Check out Container build files
        if: env.SELECTED_DISTRIBUTION == 'all' || env.SELECTED_DISTRIBUTION == matrix.distribution
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: env.SELECTED_DISTRIBUTION == 'all' || env.SELECTED_DISTRIBUTION == matrix.distribution
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.SELECTED_DISTRIBUTION == 'all' || env.SELECTED_DISTRIBUTION == matrix.distribution
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ${{ matrix.distribution }}
        if: env.SELECTED_DISTRIBUTION == 'all' || env.SELECTED_DISTRIBUTION == matrix.distribution
        shell: bash
        env:
          DISTRIBUTION: ${{ matrix.distribution }}
        run: bash "$GITHUB_WORKSPACE/build-base.sh" "$DISTRIBUTION"

      - name: Smoke test ${{ matrix.distribution }} images
        if: env.SELECTED_DISTRIBUTION == 'all' || env.SELECTED_DISTRIBUTION == matrix.distribution
        shell: bash
        env:
          DISTRIBUTION: ${{ matrix.distribution }}
        run: bash "$GITHUB_WORKSPACE/scripts/test-images.sh" "$DISTRIBUTION" "$RUNNER_TEMP/image-test-list.txt"

name: Build Linux base images

on:
  repository_dispatch:
    types: [source-mirrors-updated]
  schedule:
    - cron: '30 * * * *'
  workflow_dispatch:
    inputs:
      distribution:
        type: choice
        required: true
        default: all
        options: [all, Ubuntu, Debian, Centos, Alpine, Fedora, AlmaLinux, ArchLinux, RockyLinux]
      architecture:
        type: choice
        required: true
        default: all
        options: [all, amd64, arm64]
      version:
        description: Release to build, or all
        type: string
        default: all
      verify_only:
        description: Build and run tests without publishing
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: base-images-${{ inputs.architecture || 'all' }}-${{ inputs.verify_only && format('{0}-{1}', inputs.distribution, inputs.version || 'all') || 'publish' }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Discover releases and architectures from org source repositories
        id: targets
        env:
          SELECTED: ${{ inputs.distribution || github.event.client_payload.distribution || 'all' }}
          ARCHITECTURE: ${{ inputs.architecture || 'all' }}
          VERSION: ${{ inputs.version || 'all' }}
        run: |
          set -euo pipefail
          python3 scripts/discover-builds.py --distribution "$SELECTED" --architecture "$ARCHITECTURE" --version "$VERSION" > build-plan.json
          echo "matrix=$(cat build-plan.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: build-plan
          path: build-plan.json

  build:
    name: ${{ matrix.distribution }} ${{ matrix.version }} (${{ matrix.platform }})
    needs: discover
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: all
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR with organization GH_TOKEN_CLASSIC
        if: inputs.verify_only != true
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN_CLASSIC }}
      - name: Build ${{ matrix.distribution }} ${{ matrix.version }} ${{ matrix.platform }} from production code
        env:
          BUILD_TARGET: ${{ toJSON(matrix) }}
          VERIFY_ONLY: ${{ inputs.verify_only || false }}
        run: bash build-base.sh
      - name: Test published image
        env:
          DISTRIBUTION: ${{ matrix.distribution }}
          IMAGE_PLATFORM: ${{ matrix.platform }}
        run: bash scripts/test-images.sh "$DISTRIBUTION" "$RUNNER_TEMP/image-test-list.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.key }}
          path: ${{ runner.temp }}/image.json

  publish:
    needs: [discover, build]
    # A filtered manual build must not replace a complete multi-arch release.
    if: inputs.verify_only != true && inputs.architecture != 'amd64' && inputs.architecture != 'arm64'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: actions/download-artifact@v8
        with:
          name: build-plan
          path: plan
      - uses: actions/download-artifact@v8
        with:
          pattern: image-*
          path: results
      - name: Log in to GHCR with organization GH_TOKEN_CLASSIC
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN_CLASSIC }}
      - name: Publish tested release manifests
        run: python3 scripts/publish-manifests.py plan/build-plan.json results

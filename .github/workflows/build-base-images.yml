# Generated from organization release catalogs by scripts/generate-release-workflow.py.
name: Build base images
run-name: "Build: ${{ inputs.distribution || github.event.client_payload.distribution || 'all' }} ${{ inputs.version || 'versions' }}${{ inputs.verify_only && ' (verify)' || '' }}"

on:
  repository_dispatch:
    types: [source-mirrors-updated]
  workflow_dispatch:
    inputs:
      distribution:
        type: choice
        required: true
        default: all
        options: [all, Ubuntu, Debian, Centos, Alpine, Fedora, AlmaLinux, ArchLinux, RockyLinux]
      version:
        description: Release to build, or all
        type: string
        default: all
      verify_only:
        description: Build and run tests without publishing
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: base-images-${{ inputs.verify_only && format('verify-{0}-{1}', inputs.distribution, inputs.version || 'all') || 'publish' }}
  cancel-in-progress: false

jobs:
  discover:
    name: Discover
    runs-on: ubuntu-24.04
    outputs:
      groups: ${{ steps.plan.outputs.groups }}
      active-groups: ${{ steps.plan.outputs.active-groups }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: inputs.verify_only != true
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN_CLASSIC }}
      - name: Discover releases and architectures
        id: plan
        env:
          SELECTED: ${{ inputs.distribution || github.event.client_payload.distribution || 'all' }}
          VERSION: ${{ inputs.version || 'all' }}
          VERIFY_ONLY: ${{ inputs.verify_only || false }}
        run: |
          arguments=()
          [[ "$VERIFY_ONLY" != true ]] || arguments+=(--verify-only)
          python3 scripts/discover-builds.py --distribution "$SELECTED" --version "$VERSION" "${arguments[@]}" > build-plan.json
      - uses: actions/upload-artifact@v7
        with:
          name: build-plan
          path: build-plan.json

  # release-group: {"distribution":"AlmaLinux","version":"10"}
  Build_AlmaLinux_10:
    name: AlmaLinux 10
    needs: discover
    if: contains(fromJSON(needs.discover.outputs.active-groups), 'almalinux-10')
    uses: ./.github/workflows/build-release.yml
    with:
      distribution: "AlmaLinux"
      version: "10"
      release-key: "almalinux-10"
      targets: ${{ toJSON(fromJSON(needs.discover.outputs.groups)['almalinux-10'].targets) }}
      has-changes: ${{ fromJSON(needs.discover.outputs.groups)['almalinux-10'].has_changes }}
      verify-only: ${{ inputs.verify_only || false }}
    secrets:
      GH_TOKEN_CLASSIC: ${{ secrets.GH_TOKEN_CLASSIC }}


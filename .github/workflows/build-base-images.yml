name: Build base images
run-name: "Build: ${{ inputs.distribution || github.event.client_payload.distribution || 'all' }} ${{ inputs.version || 'versions' }}${{ inputs.verify_only && ' (verify)' || '' }}"

on:
  repository_dispatch:
    types: [source-mirrors-updated]
  workflow_dispatch:
    inputs:
      distribution:
        type: choice
        required: true
        default: all
        options: [all, Ubuntu, Debian, Centos, Alpine, Fedora, AlmaLinux, ArchLinux, RockyLinux]
      version:
        description: Release to build, or all
        type: string
        default: all
      verify_only:
        description: Build and run tests without publishing
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: base-images-${{ inputs.verify_only && format('verify-{0}-{1}', inputs.distribution, inputs.version || 'all') || 'publish' }}
  cancel-in-progress: false

jobs:
  discover:
    name: Discover
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      releases: ${{ steps.plan.outputs.releases }}
      build-count: ${{ steps.plan.outputs.build-count }}
      release-count: ${{ steps.plan.outputs.release-count }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: inputs.verify_only != true
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN_CLASSIC }}
      - name: Discover releases and architectures
        id: plan
        env:
          SELECTED: ${{ inputs.distribution || github.event.client_payload.distribution || 'all' }}
          VERSION: ${{ inputs.version || 'all' }}
          VERIFY_ONLY: ${{ inputs.verify_only || false }}
        run: |
          arguments=()
          [[ "$VERIFY_ONLY" != true ]] || arguments+=(--verify-only)
          python3 scripts/discover-builds.py --distribution "$SELECTED" --version "$VERSION" "${arguments[@]}" > build-plan.json
      - uses: actions/upload-artifact@v7
        with:
          name: build-plan
          path: build-plan.json

  build:
    name: ${{ matrix.distribution }} ${{ matrix.version }} · ${{ matrix.architecture }}
    needs: discover
    if: needs.discover.outputs.build-count != '0'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - name: Restore package downloads
        id: packages
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/package-cache
          key: packages-v1-${{ matrix.key }}-${{ matrix.fingerprint }}
          restore-keys: packages-v1-${{ matrix.key }}-
      - uses: docker/setup-qemu-action@v4
        if: matrix.emulation != ''
        with:
          platforms: ${{ matrix.emulation }}
      - uses: docker/setup-buildx-action@v4
      - name: Build ${{ matrix.architecture }}
        id: compile
        env:
          BUILD_TARGET: ${{ toJSON(matrix) }}
          PACKAGE_CACHE: ${{ runner.temp }}/package-cache
        run: |
          mkdir -p "$PACKAGE_CACHE"
          bash build-base.sh
      - name: Test ${{ matrix.architecture }}
        id: test
        env:
          DISTRIBUTION: ${{ matrix.distribution }}
          IMAGE_PLATFORM: ${{ matrix.platform }}
        run: bash scripts/test-images.sh "$DISTRIBUTION" "$RUNNER_TEMP/image-test-list.txt"
      - name: Log in to GHCR
        if: inputs.verify_only != true
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN_CLASSIC }}
      - name: Push ${{ matrix.architecture }}
        id: push
        if: inputs.verify_only != true
        run: bash scripts/push-images.sh
      - name: Save tested image result
        uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.key }}
          path: ${{ runner.temp }}/image.json
      - name: Record build, test and push results
        if: always()
        env:
          BUILD_TARGET: ${{ toJSON(matrix) }}
          BUILD_RESULT: ${{ steps.compile.outcome }}
          TEST_RESULT: ${{ steps.test.outcome }}
          PUSH_RESULT: ${{ steps.push.outcome }}
          CACHE_HIT: ${{ steps.packages.outputs.cache-matched-key != '' }}
        run: python3 scripts/summarize-builds.py record "$RUNNER_TEMP/status.json"
      - name: Save stage results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: status-${{ matrix.key }}
          path: ${{ runner.temp }}/status.json
          if-no-files-found: error
      - name: Keep package download cache bounded
        if: always()
        env:
          PACKAGE_CACHE: ${{ runner.temp }}/package-cache
        run: |
          mkdir -p "$PACKAGE_CACHE"
          sudo chown -R "$(id -u):$(id -g)" "$PACKAGE_CACHE"
          bash scripts/package-cache.sh --prune
      - name: Save package downloads
        if: always() && steps.packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/package-cache
          key: ${{ steps.packages.outputs.cache-primary-key }}

  publish:
    name: Publish · ${{ matrix.distribution }} ${{ matrix.version }}
    needs: [discover, build]
    if: always() && !cancelled() && needs.discover.result == 'success' && needs.discover.outputs.release-count != '0'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.discover.outputs.releases) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
        if: inputs.verify_only != true
      - uses: actions/download-artifact@v8
        with:
          name: build-plan
          path: plan
      - name: Download this release's tested image results
        if: needs.discover.outputs.build-count != '0'
        uses: actions/download-artifact@v8
        with:
          pattern: image-${{ matrix.key }}-*
          path: results
      - name: Log in to GHCR
        if: inputs.verify_only != true
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN_CLASSIC }}
      - name: Publish only when every architecture passed
        env:
          DISTRIBUTION: ${{ matrix.distribution }}
          VERSION: ${{ matrix.version }}
          VERIFY_ONLY: ${{ inputs.verify_only || false }}
          PUBLICATION_RESULT: ${{ runner.temp }}/publication.json
        run: |
          mkdir -p results
          arguments=()
          [[ "$VERIFY_ONLY" != true ]] || arguments+=(--validate-only)
          python3 scripts/publish-manifests.py plan/build-plan.json results --distribution "$DISTRIBUTION" --version "$VERSION" "${arguments[@]}"
      - name: Save publication result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: publication-${{ matrix.key }}
          path: ${{ runner.temp }}/publication.json

  summary:
    name: Results
    needs: [discover, build, publish]
    if: always() && !cancelled() && needs.discover.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: build-plan
          path: plan
      - uses: actions/download-artifact@v8
        with:
          pattern: status-*
          path: results
      - uses: actions/download-artifact@v8
        with:
          pattern: publication-*
          path: results
      - name: Group distribution results by architecture
        run: python3 scripts/summarize-builds.py report plan/build-plan.json results
      - name: Save grouped results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-summary
          path: ${{ runner.temp }}/results-summary.md

name: Build Linux base images

on:
  repository_dispatch:
    types: [source-mirrors-updated]
  schedule:
    - cron: '30 * * * *'
  workflow_dispatch:
    inputs:
      distribution:
        description: Distribution to build
        type: choice
        required: true
        default: all
        options: [all, Ubuntu, Debian, Centos, Alpine, Fedora, AlmaLinux, ArchLinux, RockyLinux]

permissions:
  contents: read
  packages: write

concurrency:
  group: base-images
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      SELECTED_DISTRIBUTION: ${{ inputs.distribution || github.event.client_payload.distribution || 'all' }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        distribution: [Ubuntu, Debian, Centos, Alpine, Fedora, AlmaLinux, ArchLinux, RockyLinux]
    steps:
      - name: Check out Container build files
        if: matrix.distribution == 'Centos' && (env.SELECTED_DISTRIBUTION == 'all' || env.SELECTED_DISTRIBUTION == 'Centos')
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: env.SELECTED_DISTRIBUTION == 'all' || env.SELECTED_DISTRIBUTION == matrix.distribution
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.SELECTED_DISTRIBUTION == 'all' || env.SELECTED_DISTRIBUTION == matrix.distribution
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ${{ matrix.distribution }}
        if: env.SELECTED_DISTRIBUTION == 'all' || env.SELECTED_DISTRIBUTION == matrix.distribution
        shell: bash
        env:
          DISTRIBUTION: ${{ matrix.distribution }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          org=Low-Price-Hosting
          lower=$(printf '%s' "$DISTRIBUTION" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/low-price-hosting/$lower"
          central_image="ghcr.io/low-price-hosting/container/$lower"
          mirror="https://github.com/$org/$DISTRIBUTION.git"
          source_label="https://github.com/$org/$DISTRIBUTION"
          central_label="https://github.com/$org/Container"
          cd "$RUNNER_TEMP"
          BUILD_ARGS=()

          # Keep an immutable tag per source revision (and, where needed, RPM
          # repository metadata). Moving aliases update without rebuilding.
          publish_to() {
            local destination=$1 package_source=$2 version=$3 revision=$4 context=$5 dockerfile=$6
            shift 6
            local content_key=${BUILD_CONTENT_KEY:-$revision}
            local immutable="${version}-sha${content_key:0:12}"
            if ! docker buildx imagetools inspect "$destination:$immutable" >/dev/null 2>&1; then
              docker buildx build --progress=plain --platform linux/amd64 \
                --label "org.opencontainers.image.source=$package_source" \
                --label "org.opencontainers.image.url=$source_label" \
                --label "org.opencontainers.image.revision=$revision" \
                --file "$dockerfile" --tag "$destination:$immutable" \
                "${BUILD_ARGS[@]}" --push "$context"
            else
              echo "$destination:$immutable already exists; skipping build."
            fi
            if [[ "$DISTRIBUTION" == Centos ]]; then
              docker run --rm "$destination:$immutable" /bin/bash -c \
                'grep -qi centos /etc/os-release && command -v yum'
            fi
            local alias
            for alias in "$version" "$@"; do
              docker buildx imagetools create --tag "$destination:$alias" "$destination:$immutable"
            done
          }
          publish() {
            local version=$1 revision=$2 context=$3 dockerfile=$4
            shift 4
            publish_to "$image" "$source_label" "$version" "$revision" "$context" "$dockerfile" "$@"
            publish_to "$central_image" "$central_label" "$version" "$revision" "$context" "$dockerfile" "$@"
          }
          publish_alias() {
            local alias=$1 source=$2 destination
            for destination in "$image" "$central_image"; do
              docker buildx imagetools create --tag "$destination:$alias" "$destination:$source"
            done
          }

          clone_branch() {
            local branch=$1 sparse=${2:-}
            rm -rf source
            git clone --quiet --depth=1 --filter=blob:none --single-branch \
              --branch "$branch" --sparse "$mirror" source
            if [[ -n "$sparse" ]]; then
              git -C source sparse-checkout set "$sparse"
            else
              git -C source sparse-checkout disable
            fi
          }

          branches() {
            git ls-remote --heads "$mirror" | sed 's#.*refs/heads/##'
          }

          case "$DISTRIBUTION" in
            Alpine)
              curl -fsSL --retry 3 \
                https://raw.githubusercontent.com/docker-library/official-images/master/library/alpine \
                -o alpine-library
              mapfile -t releases < <(awk '/^Tags: / {
                count = split(substr($0, 7), tags, ",")
                for (i = 1; i <= count; i++) {
                  gsub(/^ +| +$/, "", tags[i])
                  if (tags[i] ~ /^3\.[0-9]+$/) print "v" tags[i]
                }
              }' alpine-library | sort -Vu)
              ((${#releases[@]}))
              for branch in "${releases[@]}"; do
                clone_branch "$branch" x86_64
                [[ -f source/x86_64/Dockerfile ]] || continue
                version=$(cat source/VERSION)
                revision=$(git -C source rev-parse HEAD)
                minor=${version%.*}
                aliases=()
                [[ "$branch" == "${releases[-1]}" ]] && aliases+=(latest 3)
                publish "$version" "$revision" source/x86_64 source/x86_64/Dockerfile "$minor" "${aliases[@]}"
              done
              ;;
            Debian)
              git clone --quiet --depth=1 --filter=blob:none --single-branch \
                --branch dist-amd64 --sparse "$mirror" source
              mapfile -t suites < source/suites
              for suite in "${suites[@]}"; do
                case "$suite" in experimental|rc-buggy) continue;; esac
                clone_branch dist-amd64 "$suite"
                [[ -f "source/$suite/Dockerfile" ]] || continue
                revision=$(git -C source rev-parse HEAD)
                aliases=()
                [[ "$suite" == stable ]] && aliases+=(latest)
                publish "$suite" "$revision" "source/$suite" "source/$suite/Dockerfile" "${aliases[@]}"
              done
              ;;
            Fedora)
              curl -fsSL --retry 3 \
                https://raw.githubusercontent.com/docker-library/official-images/master/library/fedora \
                -o fedora-library
              mapfile -t releases < <(awk '/^Tags: / {
                count = split(substr($0, 7), tags, ",")
                for (i = 1; i <= count; i++) {
                  gsub(/^ +| +$/, "", tags[i])
                  if (tags[i] ~ /^[0-9]+$/) print tags[i]
                }
              }' fedora-library | sort -nu)
              ((${#releases[@]}))
              last_release=
              for branch in "${releases[@]}"; do
                clone_branch "$branch" x86_64
                [[ -f source/x86_64/Dockerfile ]] || continue
                revision=$(git -C source rev-parse HEAD)
                publish "$branch" "$revision" source/x86_64 source/x86_64/Dockerfile
                last_release=$branch
              done
              [[ -n "$last_release" ]]
              publish_alias latest "$last_release"
              ;;
            AlmaLinux)
              mapfile -t releases < <(branches | grep -E '^[0-9]+$' | sort -n)
              ((${#releases[@]}))
              for branch in "${releases[@]}"; do
                clone_branch "$branch" default/amd64
                [[ -f source/default/amd64/Dockerfile ]] || continue
                revision=$(git -C source rev-parse HEAD)
                mapfile -t aliases < <(sed -n 's/^# Tags: //p' source/default/amd64/Dockerfile | head -n 1 | tr ',' '\n' | xargs -n1)
                ((${#aliases[@]}))
                publish "$branch" "$revision" source/default/amd64 source/default/amd64/Dockerfile "${aliases[@]}"
              done
              ;;
            ArchLinux)
              clone_branch releases
              revision=$(git -C source rev-parse HEAD)
              version=$(sed -n 's/^LABEL org.opencontainers.image.version="\([^"]*\)"/\1/p' source/Dockerfile.base | head -n 1)
              [[ -n "$version" ]]
              publish "$version" "$revision" source source/Dockerfile.base latest base
              ;;
            RockyLinux)
              mapfile -t releases < <(branches | grep -E '^Rocky-[0-9]+\.[0-9]+\.[0-9]+-Base-x86_64$' | sort -V)
              ((${#releases[@]}))
              declare -A newest=()
              for branch in "${releases[@]}"; do
                major=${branch#Rocky-}; major=${major%%.*}
                newest[$major]=$branch
              done
              for major in "${!newest[@]}"; do
                branch=${newest[$major]}
                clone_branch "$branch"
                [[ -f source/Dockerfile ]]
                revision=$(git -C source rev-parse HEAD)
                full=${branch#Rocky-}; full=${full%-Base-x86_64}
                minor=${full%.*}
                publish "$full" "$revision" source source/Dockerfile "$minor" "$major"
              done
              latest_major=$(printf '%s\n' "${!newest[@]}" | sort -n | tail -n 1)
              publish_alias latest "$latest_major"
              ;;
            Ubuntu)
              # Tags in the official-images manifest identify the supported
              # Ubuntu OCI snapshots; all image bytes come from the org mirror.
              curl -fsSL https://raw.githubusercontent.com/docker-library/official-images/master/library/ubuntu > ubuntu-library
              mapfile -t releases < <(awk 'BEGIN {RS=""; FS="\n"} {tags=""; ref=""; for(i=1;i<=NF;i++) {if($i ~ /^Tags: /) {tags=$i; sub(/^Tags: /, "", tags)} if($i ~ /^amd64-GitFetch: /) {ref=$i; sub(/^amd64-GitFetch: /, "", ref)}} if(tags != "" && ref != "") print tags "|" ref}' ubuntu-library)
              ((${#releases[@]}))
              for entry in "${releases[@]}"; do
                tags=${entry%%|*}; ref=${entry#*|}
                tag=${ref#refs/tags/}
                rm -rf source context
                git clone --quiet --depth=1 --filter=blob:none --branch "$tag" --sparse \
                  "$mirror" source
                git -C source sparse-checkout set oci
                revision=$(git -C source rev-parse HEAD)
                manifest=$(jq -r '.manifests[0].digest | sub("^sha256:"; "")' source/oci/index.json)
                manifest_file="source/oci/blobs/sha256/$manifest"
                mkdir context
                printf 'FROM scratch\n' > context/Dockerfile
                layer_index=0
                while IFS=$'\t' read -r media_type digest; do
                  [[ "$media_type" == application/vnd.oci.image.layer.v1.tar+gzip ]]
                  layer=${digest#sha256:}
                  layer_file="source/oci/blobs/sha256/$layer"
                  tar -tf "$layer_file" > layer-contents.txt
                  if grep -Eq '(^|/)\.wh\.' layer-contents.txt; then
                    echo 'OCI whiteout layer requires a native OCI import.' >&2
                    exit 1
                  fi
                  cp "$layer_file" "context/layer-$layer_index.tar.gz"
                  printf 'ADD layer-%s.tar.gz /\n' "$layer_index" >> context/Dockerfile
                  layer_index=$((layer_index + 1))
                done < <(jq -r '.layers[] | [.mediaType, .digest] | @tsv' "$manifest_file")
                ((layer_index > 0))
                config=$(jq -r '.config.digest | sub("^sha256:"; "")' "$manifest_file")
                jq -r '.config.Env[]? | "ENV " + .' "source/oci/blobs/sha256/$config" >> context/Dockerfile
                jq -r '.config.Cmd | "CMD " + tojson' "source/oci/blobs/sha256/$config" >> context/Dockerfile
                IFS=',' read -ra aliases <<< "$tags"
                for i in "${!aliases[@]}"; do aliases[$i]="${aliases[$i]// /}"; done
                publish "${aliases[0]}" "$revision" context context/Dockerfile "${aliases[@]:1}"
              done
              ;;
            Centos)
              # The org mirror contains the official Stream container-base
              # kickstarts. Packages still come from CentOS's RPM repositories.
              clone_branch main
              mapfile -t releases < <(find source -maxdepth 1 -name 'CentOS-Stream-*-container-base.ks' \
                -printf '%f\n' | sed -nE 's/^CentOS-Stream-([0-9]+)-container-base\.ks$/\1/p' | sort -n)
              ((${#releases[@]}))
              revision=$(git -C source rev-parse HEAD)
              latest_major=
              for major in "${releases[@]}"; do
                ((major >= 9)) || continue
                rm -rf context
                mkdir context
                cp "source/CentOS-Stream-$major-container-base.ks" context/
                cp "source/CentOS-Stream-$major-container-common.ks" context/
                cp "$GITHUB_WORKSPACE/centos/Dockerfile" context/Dockerfile
                cp "$GITHUB_WORKSPACE/centos/build-rootfs.sh" context/build-rootfs.sh
                for repo in BaseOS AppStream; do
                  curl -fLsS --retry 3 \
                    "https://mirror.stream.centos.org/$major-stream/$repo/x86_64/os/repodata/repomd.xml" \
                    -o "context/$repo-repomd.xml"
                done
                BUILD_CONTENT_KEY=$({
                  printf '%s' "$revision"
                  cat context/*-repomd.xml context/Dockerfile context/build-rootfs.sh
                } | sha256sum | cut -d' ' -f1)
                BUILD_ARGS=(--build-arg "CENTOS_MAJOR=$major")
                publish "stream$major" "$revision" context context/Dockerfile
                unset BUILD_CONTENT_KEY
                BUILD_ARGS=()
                latest_major=$major
              done
              [[ -n "$latest_major" ]]
              publish_alias latest "stream$latest_major"
              ;;
          esac

name: Build base images
run-name: "Build: ${{ inputs.distribution || github.event.client_payload.distribution || 'all' }} ${{ inputs.version || 'versions' }}${{ inputs.verify_only && ' (verify)' || '' }}"

on:
  repository_dispatch:
    types: [source-mirrors-updated]
  workflow_dispatch:
    inputs:
      distribution:
        type: choice
        required: true
        default: all
        options: [all, Ubuntu, Debian, Centos, Alpine, Fedora, AlmaLinux, ArchLinux, RockyLinux]
      version:
        description: Release to build, or all
        type: string
        default: all
      verify_only:
        description: Build and run tests without publishing
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: base-images-${{ inputs.verify_only && format('verify-{0}-{1}', inputs.distribution, inputs.version || 'all') || 'publish' }}
  cancel-in-progress: false

jobs:
  discover:
    name: Discover
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
      has-builds: ${{ steps.plan.outputs.has-builds }}
      releases: ${{ steps.plan.outputs.releases }}
      has-releases: ${{ steps.plan.outputs.has-releases }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: inputs.verify_only != true
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN_CLASSIC }}
      - name: Discover releases and architectures
        id: plan
        env:
          SELECTED: ${{ inputs.distribution || github.event.client_payload.distribution || 'all' }}
          VERSION: ${{ inputs.version || 'all' }}
          VERIFY_ONLY: ${{ inputs.verify_only || false }}
        run: |
          arguments=()
          [[ "$VERIFY_ONLY" != true ]] || arguments+=(--verify-only)
          python3 scripts/discover-builds.py --distribution "$SELECTED" --version "$VERSION" "${arguments[@]}" > build-plan.json
      - uses: actions/upload-artifact@v7
        with:
          name: build-plan
          path: build-plan.json

  build:
    name: "Build: ${{ matrix.distribution }} ${{ matrix.version }} · ${{ matrix.architecture }}"
    needs: discover
    if: needs.discover.outputs.has-builds == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.discover.outputs.targets || '{"include":[]}') }}
    steps:
      - uses: actions/checkout@v7
      - name: Restore package downloads
        id: packages
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/package-cache
          key: packages-v1-${{ matrix.key }}-${{ matrix.fingerprint }}
          restore-keys: packages-v1-${{ matrix.key }}-
      - uses: docker/setup-qemu-action@v4
        if: matrix.emulation != ''
        with:
          platforms: ${{ matrix.emulation }}
      - uses: docker/setup-buildx-action@v4
      - name: Build ${{ matrix.architecture }}
        id: compile
        env:
          BUILD_TARGET: ${{ toJSON(matrix) }}
          PACKAGE_CACHE: ${{ runner.temp }}/package-cache
        run: |
          mkdir -p "$PACKAGE_CACHE"
          bash build-base.sh
      - name: Export built image for Test and Publish
        id: archive
        run: bash scripts/image-artifact.sh save "$RUNNER_TEMP/built"
      - name: Transfer built image
        uses: actions/upload-artifact@v7
        with:
          name: built-${{ matrix.key }}
          path: ${{ runner.temp }}/built
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Record build result
        if: always()
        env:
          BUILD_TARGET: ${{ toJSON(matrix) }}
          BUILD_RESULT: ${{ steps.compile.outcome == 'success' && steps.archive.outcome == 'success' && 'success' || 'failure' }}
          CACHE_HIT: ${{ steps.packages.outputs.cache-matched-key != '' }}
        run: python3 scripts/summarize-builds.py record "$RUNNER_TEMP/status.json"
      - name: Save build result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: status-build-${{ matrix.key }}
          path: ${{ runner.temp }}/status.json
          retention-days: 7
          if-no-files-found: error
      - name: Keep package download cache bounded
        if: always()
        env:
          PACKAGE_CACHE: ${{ runner.temp }}/package-cache
        run: |
          mkdir -p "$PACKAGE_CACHE"
          sudo chown -R "$(id -u):$(id -g)" "$PACKAGE_CACHE"
          bash scripts/package-cache.sh --prune
      - name: Save package downloads
        if: always() && steps.packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/package-cache
          key: ${{ steps.packages.outputs.cache-primary-key }}

  test:
    name: "Test: ${{ matrix.distribution }} ${{ matrix.version }} · ${{ matrix.architecture }}"
    needs: [discover, build]
    if: always() && !cancelled() && needs.discover.result == 'success' && needs.discover.outputs.has-builds == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.discover.outputs.targets || '{"include":[]}') }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
        if: matrix.emulation != ''
        with:
          platforms: ${{ matrix.emulation }}
      - name: Download built image
        uses: actions/download-artifact@v8
        with:
          name: built-${{ matrix.key }}
          path: ${{ runner.temp }}/built
      - name: Load the verified build artifact
        run: bash scripts/image-artifact.sh restore "$RUNNER_TEMP/built"
      - name: Test ${{ matrix.architecture }}
        id: test
        env:
          DISTRIBUTION: ${{ matrix.distribution }}
          IMAGE_PLATFORM: ${{ matrix.platform }}
        run: bash scripts/test-images.sh "$DISTRIBUTION" "$RUNNER_TEMP/image-test-list.txt"
      - name: Save tested image approval
        uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.key }}
          path: ${{ runner.temp }}/image.json
          retention-days: 7
          if-no-files-found: error
      - name: Record test result
        if: always()
        env:
          BUILD_TARGET: ${{ toJSON(matrix) }}
          TEST_RESULT: ${{ steps.test.outcome }}
        run: python3 scripts/summarize-builds.py record "$RUNNER_TEMP/status.json"
      - name: Save test result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: status-test-${{ matrix.key }}
          path: ${{ runner.temp }}/status.json
          retention-days: 7
          if-no-files-found: error

  publish:
    name: "Publish: ${{ matrix.distribution }} ${{ matrix.version }}"
    needs: [discover, test]
    if: always() && !cancelled() && needs.discover.result == 'success' && needs.discover.outputs.has-releases == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.discover.outputs.releases || '{"include":[]}') }}
    env:
      DISTRIBUTION: ${{ matrix.distribution }}
      VERSION: ${{ matrix.version }}
      RELEASE_KEY: ${{ matrix.key }}
      HAS_CHANGES: ${{ matrix.has_changes }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
        if: inputs.verify_only != true
      - uses: actions/download-artifact@v8
        with:
          name: build-plan
          path: plan
      - name: Download this release's test approvals
        if: env.HAS_CHANGES == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: image-${{ env.RELEASE_KEY }}-*
          path: results
      - name: Log in to GHCR
        if: inputs.verify_only != true
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN_CLASSIC }}
      - name: Publish only when every architecture passed
        id: publication
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_CLASSIC }}
          VERIFY_ONLY: ${{ inputs.verify_only || false }}
          PUBLICATION_RESULT: ${{ runner.temp }}/publication.json
        run: |
          mkdir -p results
          arguments=()
          [[ "$VERIFY_ONLY" != true ]] || arguments+=(--validate-only)
          python3 scripts/publish-release.py plan/build-plan.json results --distribution "$DISTRIBUTION" --version "$VERSION" "${arguments[@]}"
      - name: Save push results
        if: always() && inputs.verify_only != true
        uses: actions/upload-artifact@v7
        with:
          name: status-push-${{ env.RELEASE_KEY }}
          path: ${{ runner.temp }}/push-status
          retention-days: 7
          if-no-files-found: ignore
      - name: Save publication result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: publication-${{ env.RELEASE_KEY }}
          path: ${{ runner.temp }}/publication.json
          retention-days: 7
          if-no-files-found: error

  summary:
    name: Results
    needs: [discover, publish]
    if: always() && !cancelled() && needs.discover.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: build-plan
          path: plan
      - uses: actions/download-artifact@v8
        with:
          pattern: status-*
          path: results
      - uses: actions/download-artifact@v8
        with:
          pattern: publication-*
          path: results
      - name: Group distribution results by architecture
        run: python3 scripts/summarize-builds.py report plan/build-plan.json results
      - name: Save grouped results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-summary
          path: ${{ runner.temp }}/results-summary.md

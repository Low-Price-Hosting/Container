# Generated from organization release catalogs by scripts/generate-release-workflow.py.
name: Build base images
run-name: "Build: ${{ inputs.distribution || github.event.client_payload.distribution || 'all' }} ${{ inputs.version || 'versions' }}${{ inputs.verify_only && ' (verify)' || '' }}"

on:
  repository_dispatch:
    types: [source-mirrors-updated]
  workflow_dispatch:
    inputs:
      distribution:
        type: choice
        required: true
        default: all
        options: [all, Ubuntu, Debian, Centos, Alpine, Fedora, AlmaLinux, ArchLinux, RockyLinux]
      version:
        description: Release to build, or all
        type: string
        default: all
      verify_only:
        description: Build and run tests without publishing
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: base-images-${{ inputs.verify_only && format('verify-{0}-{1}', inputs.distribution, inputs.version || 'all') || 'publish' }}
  cancel-in-progress: false

jobs:
  discover:
    name: Discover
    runs-on: ubuntu-24.04
    outputs:
      groups: ${{ steps.plan.outputs.groups }}
      active-groups: ${{ steps.plan.outputs.active-groups }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: inputs.verify_only != true
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN_CLASSIC }}
      - name: Discover releases and architectures
        id: plan
        env:
          SELECTED: ${{ inputs.distribution || github.event.client_payload.distribution || 'all' }}
          VERSION: ${{ inputs.version || 'all' }}
          VERIFY_ONLY: ${{ inputs.verify_only || false }}
        run: |
          arguments=()
          [[ "$VERIFY_ONLY" != true ]] || arguments+=(--verify-only)
          python3 scripts/discover-builds.py --distribution "$SELECTED" --version "$VERSION" "${arguments[@]}" > build-plan.json
      - uses: actions/upload-artifact@v7
        with:
          name: build-plan
          path: build-plan.json

# release-group-capacity: {"AlmaLinux":3,"Alpine":4,"ArchLinux":1,"Centos":2,"Debian":2,"Fedora":2,"RockyLinux":3,"Ubuntu":3}
  Build_Group_01:
    name: ${{ fromJSON(needs.discover.outputs.groups || '{}')['1'].name || 'Group 1 (idle)' }}
    needs: discover
    if: contains(fromJSON(needs.discover.outputs.active-groups || '[]'), '1')
    uses: ./.github/workflows/build-release.yml
    with:
      distribution: ${{ fromJSON(needs.discover.outputs.groups || '{}')['1'].distribution }}
      version: ${{ fromJSON(needs.discover.outputs.groups || '{}')['1'].version }}
      release-key: ${{ fromJSON(needs.discover.outputs.groups || '{}')['1'].key }}
      targets: ${{ toJSON(fromJSON(needs.discover.outputs.groups || '{}')['1'].targets) }}
      has-changes: ${{ fromJSON(needs.discover.outputs.groups || '{}')['1'].has_changes }}
      verify-only: ${{ inputs.verify_only || false }}
    secrets:
      GH_TOKEN_CLASSIC: ${{ secrets.GH_TOKEN_CLASSIC }}


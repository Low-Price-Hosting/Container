name: Build Linux base images

on:
  repository_dispatch:
    types: [source-mirrors-updated]
  workflow_dispatch:
    inputs:
      distribution:
        type: choice
        required: true
        default: all
        options: [all, Ubuntu, Debian, Centos, Alpine, Fedora, AlmaLinux, ArchLinux, RockyLinux]
      architecture:
        type: choice
        required: true
        default: all
        options: [all, amd64, arm64]
      version:
        description: Release to build, or all
        type: string
        default: all
      verify_only:
        description: Build and run tests without publishing
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: base-images-${{ inputs.architecture || 'all' }}-${{ inputs.verify_only && format('{0}-{1}', inputs.distribution, inputs.version || 'all') || 'publish' }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      has_releases: ${{ steps.targets.outputs.has_releases }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: inputs.verify_only != true
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN_CLASSIC }}
      - name: Discover releases and architectures from org source repositories
        id: targets
        env:
          SELECTED: ${{ inputs.distribution || github.event.client_payload.distribution || 'all' }}
          ARCHITECTURE: ${{ inputs.architecture || 'all' }}
          VERSION: ${{ inputs.version || 'all' }}
          VERIFY_ONLY: ${{ inputs.verify_only || false }}
        run: |
          set -euo pipefail
          arguments=()
          [[ "$VERIFY_ONLY" != true ]] || arguments+=(--verify-only)
          python3 scripts/discover-builds.py --distribution "$SELECTED" --architecture "$ARCHITECTURE" --version "$VERSION" "${arguments[@]}" > build-plan.json
      - uses: actions/upload-artifact@v7
        with:
          name: build-plan
          path: build-plan.json

  build:
    name: "Build: ${{ matrix.distribution }} ${{ matrix.version }}"
    needs: discover
    if: needs.discover.outputs.has_releases == 'true'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    uses: ./.github/workflows/build-release.yml
    with:
      distribution: ${{ matrix.distribution }}
      version: ${{ matrix.version }}
      release-key: ${{ matrix.key }}
      targets: ${{ toJSON(matrix.targets) }}
      has-changes: ${{ matrix.has_changes }}
      has-errors: ${{ matrix.has_errors }}
      verify-only: ${{ inputs.verify_only || false }}
      # Filtered manual builds must not replace the complete multi-arch tag.
      publish-release: ${{ inputs.architecture != 'amd64' && inputs.architecture != 'arm64' }}
    secrets:
      GH_TOKEN_CLASSIC: ${{ secrets.GH_TOKEN_CLASSIC }}

  summary:
    name: Results
    needs: [discover, Build_AlmaLinux_10, Build_AlmaLinux_8, Build_AlmaLinux_9, Build_Alpine_3_21, Build_Alpine_3_22, Build_Alpine_3_23, Build_Alpine_3_24, Build_ArchLinux_rolling, Build_Centos_stream10, Build_Centos_stream9, Build_Debian_bookworm, Build_Debian_trixie, Build_Fedora_43, Build_Fedora_44, Build_RockyLinux_10, Build_RockyLinux_8, Build_RockyLinux_9, Build_Ubuntu_22_04, Build_Ubuntu_24_04, Build_Ubuntu_26_04]
    if: always() && !cancelled() && needs.discover.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: build-plan
          path: plan
      - uses: actions/download-artifact@v8
        with:
          pattern: status-*
          path: results
      - uses: actions/download-artifact@v8
        with:
          pattern: publication-*
          path: results
      - name: Group distribution results by architecture
        run: python3 scripts/summarize-builds.py report plan/build-plan.json results
      - name: Save grouped results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-summary
          path: ${{ runner.temp }}/results-summary.md

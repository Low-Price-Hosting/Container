name: Refresh release jobs

on:
  repository_dispatch:
    types: [source-mirrors-updated]
  workflow_dispatch:
    inputs:
      distribution:
        type: choice
        default: all
        options: [all, Ubuntu, Debian, Centos, Alpine, Fedora, AlmaLinux, ArchLinux, RockyLinux]

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-release-jobs
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_TOKEN_CLASSIC }}
      - name: Refresh version jobs and start builds
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_CLASSIC }}
          SELECTED: ${{ inputs.distribution || github.event.client_payload.distribution || 'all' }}
        run: bash scripts/refresh-build-workflow.sh

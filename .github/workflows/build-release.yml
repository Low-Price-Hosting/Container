name: Build, test and publish one release

on:
  workflow_call:
    inputs:
      distribution:
        required: true
        type: string
      version:
        required: true
        type: string
      release-key:
        required: true
        type: string
      targets:
        required: true
        type: string
      has-changes:
        required: true
        type: boolean
      has-errors:
        required: true
        type: boolean
      verify-only:
        type: boolean
        default: false
      publish-release:
        type: boolean
        default: true
    secrets:
      GH_TOKEN_CLASSIC:
        required: false

permissions:
  contents: read
  packages: write

jobs:
  architecture:
    name: ${{ matrix.platform || 'No changed architectures' }}
    if: inputs.has-changes
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(inputs.targets) }}
    steps:
      - uses: actions/checkout@v7
      - name: Restore package downloads
        id: packages
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/package-cache
          key: packages-v1-${{ matrix.key }}-${{ matrix.fingerprint }}
          restore-keys: packages-v1-${{ matrix.key }}-
      - uses: docker/setup-qemu-action@v4
        if: matrix.emulation != ''
        with:
          platforms: ${{ matrix.emulation }}
      - uses: docker/setup-buildx-action@v4
      - name: Build ${{ matrix.platform }}
        id: compile
        env:
          BUILD_TARGET: ${{ toJSON(matrix) }}
          PACKAGE_CACHE: ${{ runner.temp }}/package-cache
        run: |
          mkdir -p "$PACKAGE_CACHE"
          bash build-base.sh
      - name: Test ${{ matrix.platform }}
        id: test
        env:
          DISTRIBUTION: ${{ inputs.distribution }}
          IMAGE_PLATFORM: ${{ matrix.platform }}
        run: bash scripts/test-images.sh "$DISTRIBUTION" "$RUNNER_TEMP/image-test-list.txt"
      - name: Log in to GHCR
        if: inputs.verify-only != true
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN_CLASSIC }}
      - name: Push ${{ matrix.platform }}
        id: push
        if: inputs.verify-only != true
        run: bash scripts/push-images.sh
      - name: Save tested image result
        uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.key }}
          path: ${{ runner.temp }}/image.json
      - name: Keep package download cache bounded
        if: always()
        env:
          PACKAGE_CACHE: ${{ runner.temp }}/package-cache
        run: |
          mkdir -p "$PACKAGE_CACHE"
          sudo chown -R "$(id -u):$(id -g)" "$PACKAGE_CACHE"
          bash scripts/package-cache.sh --prune
      - name: Save package downloads
        if: always() && steps.packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/package-cache
          key: ${{ steps.packages.outputs.cache-primary-key }}
      - name: Build, test and push summary
        if: always()
        env:
          TARGET_NAME: ${{ inputs.distribution }} ${{ inputs.version }} (${{ matrix.platform }})
          BUILD_RESULT: ${{ steps.compile.outcome }}
          TEST_RESULT: ${{ steps.test.outcome }}
          PUSH_RESULT: ${{ steps.push.outcome }}
          CACHE_HIT: ${{ steps.packages.outputs.cache-matched-key != '' }}
        run: |
          printf '## %s\n\n| Stage | Result |\n|---|---|\n| Build | %s |\n| Local runtime test | %s |\n| Push | %s |\n| Package cache restored | %s |\n' "$TARGET_NAME" "$BUILD_RESULT" "$TEST_RESULT" "$PUSH_RESULT" "$CACHE_HIT" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish
    needs: architecture
    if: always() && !cancelled() && ((inputs.publish-release && !inputs.verify-only) || inputs.has-errors)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: actions/download-artifact@v8
        with:
          name: build-plan
          path: plan
      - uses: actions/download-artifact@v8
        if: inputs.has-changes
        with:
          pattern: image-${{ inputs.release-key }}-*
          path: results
      - name: Log in to GHCR
        if: inputs.publish-release && !inputs.verify-only
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN_CLASSIC }}
      - name: Publish only when every architecture passed
        env:
          DISTRIBUTION: ${{ inputs.distribution }}
          VERSION: ${{ inputs.version }}
          PUBLISH_RELEASE: ${{ inputs.publish-release && !inputs.verify-only }}
        run: |
          mkdir -p results
          arguments=()
          [[ "$PUBLISH_RELEASE" == true ]] || arguments+=(--validate-only)
          python3 scripts/publish-manifests.py plan/build-plan.json results --distribution "$DISTRIBUTION" --version "$VERSION" "${arguments[@]}"
